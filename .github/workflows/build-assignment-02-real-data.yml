name: Build Assignment 2 Real USDA Data

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      # A workflow dispatched from this preparatory branch needs its new build
      # and verification code even though the working tree deliberately starts
      # at the latest main commit.
      - name: Check out dispatched workflow source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: .workflow-source

      - name: Install preparatory processing code over latest main
        run: |
          cp .workflow-source/data/assignment-02/scripts/build_real_usda_data.py data/assignment-02/scripts/
          cp .workflow-source/data/assignment-02/scripts/README_ACTIONS.md data/assignment-02/scripts/
          cp .workflow-source/data/assignment-02/verify_assignment_02.py data/assignment-02/
          cp .workflow-source/data/assignment-02/.gitignore data/assignment-02/
          rm -rf .workflow-source

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: data/assignment-02/requirements.txt

      - name: Install geospatial dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install geopandas pyogrio fiona shapely pandas numpy requests rasterio folium branca matplotlib pyproj

      - name: Download official USDA data and build derived products
        run: python data/assignment-02/scripts/build_real_usda_data.py

      - name: Verify real-data products
        run: python data/assignment-02/verify_assignment_02.py

      - name: Compile Assignment 2 Python
        run: python -m compileall -q data/assignment-02

      - name: Upload complete derived Assignment 2 directory
        uses: actions/upload-artifact@v4
        with:
          name: assignment-02-real-usda-data
          path: data/assignment-02
          if-no-files-found: error
          retention-days: 30

      - name: Commit derived products to correction branch
        env:
          TARGET_BRANCH: feature/assignment-02-real-data-fix
        run: |
          rm -rf data/assignment-02/source_downloads data/assignment-02/rasters
          find data/assignment-02 -type d -name __pycache__ -prune -exec rm -rf {} +
          find data/assignment-02 -type f \( -name '*.pyc' -o -name '*.pyo' -o -name '*.zip' -o -name '*.tif' -o -name '*.tiff' \) -delete
          git switch -C "$TARGET_BRANCH"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            data/assignment-02/.gitignore \
            data/assignment-02/README.md \
            data/assignment-02/cdl_EPSG4326.csv \
            data/assignment-02/field_summary.csv \
            data/assignment-02/fields_EPSG4326.geojson \
            data/assignment-02/fields_with_crops.geojson \
            data/assignment-02/my_fields_map.html \
            data/assignment-02/evidence \
            data/assignment-02/output \
            data/assignment-02/scripts/build_real_usda_data.py \
            data/assignment-02/scripts/README_ACTIONS.md \
            data/assignment-02/verify_assignment_02.py \
            docs/project/assignment-02-tracker.md
          if git diff --cached --quiet; then
            echo "No derived changes to commit."
          else
            git commit -m "Replace Assignment 2 synthetic records with real USDA data"
          fi
          git push --force-with-lease origin "$TARGET_BRANCH"
