name: Assignment 6 validation

on:
  pull_request:
    paths:
      - "data/assignment-06/**"
      - "notebooks/06_weather_climate_trends.ipynb"
      - ".github/workflows/assignment-06-validation.yml"
      - ".gitignore"
  push:
    branches: [main]
    paths:
      - "data/assignment-06/**"
      - "notebooks/06_weather_climate_trends.ipynb"
      - ".github/workflows/assignment-06-validation.yml"
      - ".gitignore"

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: data/assignment-06/requirements.txt

      - name: Install Assignment 6 dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r data/assignment-06/requirements.txt

      - name: Regenerate analytical images and summaries
        run: python data/assignment-06/scripts/run_assignment_06_weather_climate.py --offline

      - name: Build and execute notebook
        run: |
          python data/assignment-06/scripts/build_assignment_06_notebook.py
          jupyter nbconvert \
            --execute \
            --to notebook \
            --inplace \
            notebooks/06_weather_climate_trends.ipynb \
            --ExecutePreprocessor.timeout=900

      - name: Verify Assignment 6
        run: python data/assignment-06/verify_assignment_06.py

      - name: Confirm generated image inventory
        run: |
          test "$(find data/assignment-06/output/visualizations -maxdepth 1 -name '*.png' | wc -l)" -eq 6
          test "$(find data/assignment-06/output/dashboard_assets -maxdepth 1 -name '*.png' | wc -l)" -eq 2
