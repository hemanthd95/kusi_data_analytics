name: Assignment 8 validation

on:
  pull_request:
    paths:
      - "data/assignment-02/field_summary.csv"
      - "data/assignment-04/output/field_ssurgo_intersections.csv"
      - "data/assignment-08/**"
      - "notebooks/08_soil_health_sustainability.ipynb"
      - "docs/project/assignment-08-tracker.md"
      - ".github/workflows/assignment-08-validation.yml"
      - ".gitignore"
      - "data/README.md"
  push:
    branches: [main]
    paths:
      - "data/assignment-02/field_summary.csv"
      - "data/assignment-04/output/field_ssurgo_intersections.csv"
      - "data/assignment-08/**"
      - "notebooks/08_soil_health_sustainability.ipynb"
      - "docs/project/assignment-08-tracker.md"
      - ".github/workflows/assignment-08-validation.yml"
      - ".gitignore"
      - "data/README.md"

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: data/assignment-08/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r data/assignment-08/requirements.txt
      - name: Generate analysis and execute notebook
        run: |
          python data/assignment-08/scripts/run_assignment_08_soil_health.py
          python data/assignment-08/scripts/build_assignment_08_notebook.py
          jupyter nbconvert --execute --to notebook --inplace notebooks/08_soil_health_sustainability.ipynb --ExecutePreprocessor.timeout=900
          python data/assignment-08/scripts/normalize_assignment_08_notebook.py
      - name: Verify Assignment 8
        run: python data/assignment-08/verify_assignment_08.py
      - name: Confirm deterministic regeneration
        run: |
          find data/assignment-08/output -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/assignment08-before.sha256
          sha256sum notebooks/08_soil_health_sustainability.ipynb >> /tmp/assignment08-before.sha256
          python data/assignment-08/scripts/run_assignment_08_soil_health.py >/dev/null
          python data/assignment-08/scripts/build_assignment_08_notebook.py >/dev/null
          jupyter nbconvert --execute --to notebook --inplace notebooks/08_soil_health_sustainability.ipynb --ExecutePreprocessor.timeout=900 >/dev/null
          python data/assignment-08/scripts/normalize_assignment_08_notebook.py >/dev/null
          find data/assignment-08/output -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/assignment08-after.sha256
          sha256sum notebooks/08_soil_health_sustainability.ipynb >> /tmp/assignment08-after.sha256
          diff -u /tmp/assignment08-before.sha256 /tmp/assignment08-after.sha256
          python data/assignment-08/verify_assignment_08.py
      - name: Commit validated Assignment 8 artifacts
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f \
            data/assignment-08/SOIL_HEALTH_REPORT.md \
            data/assignment-08/evidence \
            data/assignment-08/output \
            notebooks/08_soil_health_sustainability.ipynb
          if ! git diff --cached --quiet; then
            git commit -m "Commit validated Assignment 8 artifacts"
            git push
          fi
      - name: Confirm committed artifact inventory
        run: |
          test "$(git ls-files 'data/assignment-08/output/visualizations/*.png' | wc -l)" -eq 2
          test "$(git ls-files 'data/assignment-08/output/dashboard_assets/*.png' | wc -l)" -eq 2
          test "$(git ls-files 'data/assignment-08/output/tables/*.csv' | wc -l)" -eq 3
          test -f data/assignment-08/output/soil_health_summary.json
          test -f data/assignment-08/SOIL_HEALTH_REPORT.md
          test -f data/assignment-08/evidence/assignment_08_evidence_summary.md
          test -f notebooks/08_soil_health_sustainability.ipynb
      - name: Upload Assignment 8 package
        uses: actions/upload-artifact@v4
        with:
          name: assignment-08-soil-health-package
          path: |
            data/assignment-08/output
            data/assignment-08/SOIL_HEALTH_REPORT.md
            data/assignment-08/evidence
            notebooks/08_soil_health_sustainability.ipynb
          if-no-files-found: error
